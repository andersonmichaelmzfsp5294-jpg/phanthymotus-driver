samsung-watch7:
  image: __IMAGE__
  container_name: embodied-samsung-watch7
  network_mode: host
  volumes:
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
    - PYTHONUNBUFFERED=1
    - WATCH7_DEVICE_TOKEN
    # Explicitly disabled on Bumi until a separate actuator safety acceptance.
    - WATCH7_HAPTIC_ACTIONS_ENABLED=0
    # Research metadata indexing stays off until separate review/consent.
    - WATCH7_RECORDING_INDEX_ENABLED=0
    # All raw/high-sensitivity research data planes require separate approval.
    - WATCH7_IMU_STREAM_ENABLED=0
    - WATCH7_PPG_RAW_ENABLED=0
    - WATCH7_ECG_ENABLED=0
    - WATCH7_BIA_ENABLED=0
    - WATCH7_LOCATION_ENABLED=0
    - WATCH7_AUDIO_ENABLED=0
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: always
