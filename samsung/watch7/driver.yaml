id: samsung-watch7-driver
name: Samsung Galaxy Watch7 Bundle
category: driver
hardware_provider: samsung
hardware_model: "watch7"
image_name: samsung-watch7
port: 15750
mcp_url: "http://localhost:15750/mcp"
description: "Galaxy Watch7 — six read-only Sensors and one opt-in haptic Actuator (companion APK required)"
build_context_extras:
  - ../../common
cards:
  - { name: heart_rate, type: sensor }
  - { name: device_state, type: sensor }
  - { name: watch_motion, type: sensor }
  - { name: watch_environment, type: sensor }
  - { name: watch_vitals, type: sensor }
  - { name: watch_activity, type: processor }
  - { name: watch_recordings, type: sensor }
  - { name: watch_haptic, type: actuator }
